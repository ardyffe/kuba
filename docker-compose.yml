services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-kuba}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-kuba}
      POSTGRES_DB: ${POSTGRES_DB:-kuba}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-kuba} -d ${POSTGRES_DB:-kuba}"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  postgres_data:
